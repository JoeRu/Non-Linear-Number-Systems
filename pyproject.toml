[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capfib"
version = "0.1.0"
description = "Capacity-constrained Fibonacci numeration: counting and asymptotics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pyyaml>=6.0", "mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["capfib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is registered, not deselected: marked tests still run by default.
# Use `-m "not slow"` to skip them deliberately.
markers = [
    "slow: takes tens of seconds (exhaustive enumeration against the brute-force oracle)",
    "oracle_gate: compares a public computation against a real, tracked oracle; tests/conftest.py fails the session if one of these skips rather than runs",
]
