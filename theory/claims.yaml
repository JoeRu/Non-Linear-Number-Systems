- id: convention-duplicated-place
  statement: "The convention F_1 = F_2 = 1 retains two distinct places of value 1."
  status: cited
  evidence: "theory/01-background.md §1.1"
  source: "web-dreamer.de 2009; Lekkerkerker 1952"

- id: place-range
  statement: "R_c(N) ranges over all places F_k <= N, not a fixed length n."
  status: cited
  evidence: "theory/00-definitions.md; spec §4.3 Trap 1"
  source: "spec 2026-08-19 §4.3"

- id: sum-of-squares
  statement: "sum_{k<=n} F_k^2 = F_n * F_{n+1}."
  status: theorem
  evidence: "Proved by induction on n in theory/03-invariants.md (sum-of-squares); corroborated numerically by tests/test_fib.py::test_sum_of_squares_identity, n <= 20"
  source: "classical Fibonacci identity"

- id: completeness-no-gaps
  statement: "Every integer in [0, sum_{k<=n} F_k^2] has at least one representation."
  status: theorem
  evidence: "Overlapping-interval induction in theory/01-background.md §3, valid for the duplicated 1-place; formalised in Lean as exists_numeral_of_le in lean/NonLinearNumberSystems/Completeness.lean"
  source: "Fraenkel 1985, Systems of Numeration"

- id: leading-constant
  statement: "log R_c(N) ~ (log N)^2 / (4 log phi). Equivalently, the limit of log R_c(N)/(log N)^2 exists and equals 1/(4 log phi) = 0.5195217... . This is C5; it is a statement about the limit, not a pointwise one, and it says nothing about any individual N."
  status: theorem
  evidence: "Proved in docs/phases/phase2_bounds.md section 8 (Lemma F, T5, C5), the lower half being new and the upper half being T2; the completeness step Lemma F rests on is formalised in Lean as exists_numeral_of_le in lean/NonLinearNumberSystems/Completeness.lean"
  source: "this project, Phase 2"

- id: gate-local-slope
  statement: "The local slope of the Legendre-transform upper bound on log R_c(N) against (log N)^2 measures 0.518710 at N = 10^3200, rising monotonically across the sampled exponents 50..3200 toward 1/(4 log phi) = 0.519522. This is a measurement of the transform at finitely many N. It does NOT bound C_c: a leading coefficient is a limit, and finitely many sampled slopes constrain no limit. Both rival candidates are excluded on paper instead -- 1/(2 log phi) = 1.039022 by T2 together with T1, and 1/(8 log phi) = 0.259761 by C5 (claim leading-constant), unconditionally and by a route that does not pass through this measurement at all. Note the direction, since it was once recorded backwards: the measured slopes lie BELOW 1/(2 log phi) and ABOVE 1/(8 log phi)."
  status: verified-numeric
  evidence: "data/phase0_5_gate.csv via scripts/run_phase0_gate.py"
  source: "docs/phases/phase0_5_gate.md"

- id: saddle-tightness
  statement: "The saddle-point correction to min_s [sN + log F_c(e^-s)] is of lower order than (log N)^2, so the Legendre transform and log R_c(N) share the leading coefficient 1/(4 log phi)."
  status: theorem
  evidence: "Follows from T1, T2 and T5 of docs/phases/phase2_bounds.md. T1 puts log R_c(N) at or below the transform. T2 applied at s = t/(2 log phi N) puts the transform at or below t^2/(4 log phi) - t log t/(2 log phi) + O(t), with t = log N, since that s is one candidate in the minimum. T5 puts log R_c(N) at or above t^2/(4 log phi) - t log t/(2 log phi) - 7.5 t. The t^2 and t log t terms cancel between the two, so the correction is O(t) = O(log N) -- stronger than the o((log N)^2) this claim asserts, and stronger than the O(t log t) a looser reading gives. Measured, the correction is close to log N itself. The chernoff_certified column of data/phase2_bounds.csv is log_R_bound_certified(n) -- a certified upper bound evaluated at a numerically located minimiser, hence at or above Lambda(N), so the ratio it yields over-estimates the correction. That ratio, (chernoff_certified - log R_c)/log N, runs 1.379, 1.085, 1.025, 0.999, 0.987, 0.981 at N = 8, 10^2, 10^3, 10^4, 10^5, 10^6. This is a consequence of Phase 2, not of the Phase 5 saddle-point analysis it was originally expected to need."
  source: "this project, Phase 2"

- id: saddle-correction-constant
  statement: "The saddle-point correction D(N) = Lambda(N) - log R_c(N), where Lambda(N) = min_s [sN + log F_c(e^-s)], has a determined leading coefficient in log N -- that is, D(N)/log N converges. The ORDER is settled by Phase 2 (0 <= D(N) <= K log N, see claim saddle-tightness); what is open is the constant, and whether the ratio converges at all. This is NOT the same question as claim secondary-term-constant, and the two must not be identified."
  status: open
  evidence: "Not established. The order follows from T1, T2 and T5 of docs/phases/phase2_bounds.md; the constant does not, because T2's error term is a bound O(t) and never an asymptotic constant, while T5's is -7.5 t, so the two do not meet. Numerically the measured ratio (which over-estimates D(N)/log N, since the CSV column is a certified bound at or above Lambda) is still drifting downward through 0.981 at N = 10^6, so the numerics name no candidate constant either."
  source: "Phase 5 rigorisation target"

- id: secondary-term-constant
  statement: "c_2 exists in log R_c(N) = (log N)^2/(4 log phi) - (log N)(loglog N)/(2 log phi) + c_2 log N + o(log N). This is the c_2 of research question (B) in theory/00-definitions.md. Under the normalisation used in docs/roadmap.md Phase 3, which factors 1/log phi out of every term, the same constant is written C_2."
  status: open
  evidence: "Not established. Phase 2 pins the first two coefficients -- T2's effective form and T5 carry the same t^2 and t log t terms, with t = log N -- but bounds the remainder only by an unspecified O(t) from above (T2) and by -7.5 t from below (T5). Writing Lambda(N) = t^2/(4 log phi) - t log t/(2 log phi) + E(N), one has c_2 = lim (E(N) - D(N))/t whenever both limits exist, so this is a strictly different open question from claim saddle-correction-constant: settling D's coefficient would not settle c_2 unless E's coefficient were also known, and E's is not -- T2 bounds E, it does not evaluate it."
  source: "research question (B); Phase 5 rigorisation target"

- id: dp-gf-agree-to-nmax
  statement: "capfib.dp and capfib.gf agree on every coefficient of R_c(N) for N <= 1000000."
  status: verified-numeric
  evidence: "data/phase1_summary.json (crosscheck field), produced by scripts/run_phase1.py"
  source: "this project, Phase 1"

- id: rc-not-monotone
  statement: "R_c(N) is not monotone: over N <= 1000000 the census records 504441 increasing steps, 11 flat steps and 495548 decreasing steps out of 1000000, i.e. 49.6% of steps are decreasing."
  status: verified-numeric
  evidence: "data/phase1_summary.json (census field)"
  source: "this project, Phase 1"

- id: place-jump-decay
  statement: "Over the distinct place values F <= 1000000, R_c(F)/R_c(F-1) equals exactly 1.0 at F=2, rises at F=3 and F=8, and decays monotonically from F=13 up to the largest place in that range, F=832040. It does NOT exceed 1 at every place in the range, and is NOT monotone over it. The decay is an observation over the measured range; no behaviour beyond F=832040 is asserted, and neither is a limit."
  status: verified-numeric
  evidence: "data/phase1_summary.json (place_jumps field), checked exhaustively at every distinct place F <= 1000000 -- 30 places, the largest 832040"
  source: "this project, Phase 1"

- id: block-extremal-n
  statement: "Argmax and argmin of R_c within each Fibonacci block [F, F') over N <= 1000000, ties broken toward the smallest N."
  status: verified-numeric
  evidence: "data/phase1_summary.json (block_extrema field)"
  source: "open problem 2, theory/01-background.md section 14"

- id: gf-global-checksum
  statement: "For the fixed-length system on F_1..F_n, sum(counts) equals prod(F_k+1). Reproducible from the test suite for n <= 14. This invariant is insensitive to sum-preserving corruption and does not exercise the production place set; it is not a licence to report values."
  status: theorem
  evidence: "Proved in theory/03-invariants.md (gf-global-checksum): each digit tuple has exactly one value, so summing counts over all values counts every tuple exactly once. Corroborated in tests/test_checksum.py for n <= 14, which also asserts the sum-preserving blind spot (test_checksum_misses_sum_preserving_corruption)."
  source: "this project, Phase 1"

- id: sc-monotone
  statement: "S_c(N) = sum_{n<=N} R_c(n) is non-decreasing."
  status: theorem
  evidence: "Proved in theory/03-invariants.md (sc-monotone): R_c(n) >= 0 for all n since it counts digit tuples, so S_c(N+1) - S_c(N) = R_c(N+1) >= 0. Corroborated in tests/test_stats.py::test_summatory_is_exact_ints_and_monotone."
  source: "this project"

- id: flat-steps-end-early
  statement: "Over N <= 1000000 there are exactly 11 flat steps (R_c(N) = R_c(N-1)), at N = 2, 7, 12, 15, 20, 28, 33, 36, 57, 67, 78, all below N = 79. No further flat step occurs in the remaining measured range."
  status: verified-numeric
  evidence: "data/phase1_summary.json (flat_step_positions field)"
  source: "this project, Phase 1"

- id: completeness-empirical
  statement: "min(counts) = 1 over N <= 1000000: every N in this range has at least one representation. This is a measurement over the computed range, not the general completeness statement. It was evidence toward the Lean theorem exists_numeral_of_le (see claim completeness-no-gaps), which Phase 2 proved with no `sorry`; it is not a substitute for that proof."
  status: verified-numeric
  evidence: "data/phase1_summary.json (min_count field)"
  source: "this project, Phase 1"

- id: sandwich-bounds
  statement: "1/(8 log phi) <= liminf log R_c(N)/(log N)^2 <= limsup log R_c(N)/(log N)^2 <= 1/(4 log phi). This is C4. It bounds the liminf and limsup only and on its own does not assert that the limit exists; existence, and the value 1/(4 log phi), come from C5 (claim leading-constant), which supersedes C4's lower half and is proved by a different construction. C4 remains true and is retained: T3's lower bound stands as proved, and C4 is the weaker statement T5 improves on."
  status: theorem
  evidence: "Proved in docs/phases/phase2_bounds.md (T1, T2, T3, C4); the fixup step is formalised in Lean as exists_numeral_of_le in lean/NonLinearNumberSystems/Completeness.lean"
  source: "this project, Phase 2"

- id: chernoff-effective-verified
  statement: "The certified Chernoff bound log R_c(N) <= s N + log F_c(e^-s) was checked against the exact value at each of the 37 sampled N in data/phase1_data.csv, which span 2 to 1000000, and held -- strictly -- at each of them. The smallest slack over the sample is 1.94, at N = 2. This is a check at 37 points, not at every N <= 1000000."
  status: verified-numeric
  evidence: "data/phase2_bounds.csv via scripts/run_phase2.py, gated on the float and certified evaluations agreeing to 1e-12 in the same run"
  source: "this project, Phase 2"

- id: product-residual-sampled
  statement: "The residual log F_c(e^-s) - (log(1/s))^2/(4 log phi) was evaluated at eight sampled values of t = log(1/s) in [10, 1280]. Over the full sweep its spread is 0.018236, driven by the single pre-asymptotic point t = 10, where it reads 3.209239; over the seven samples with t >= 20 it sits at 3.227397 with a spread of 1.78e-4. This is a sampled observation at those eight points: it is not a proved O(1) error term (T2 establishes O(T), and nothing here upgrades that), and it says nothing about s between or beyond the samples."
  status: verified-numeric
  evidence: "data/phase2_residual.csv via scripts/run_phase2.py, each sampled point gated on the float and certified evaluations agreeing to 1e-12"
  source: "this project, Phase 2"
